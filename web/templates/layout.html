{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{.Title}} · couchness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/htmx.min.js"></script>
<style>
:root { color-scheme: dark; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  margin: 0 auto;
  max-width: 1100px;
  padding: 1rem;
  background: #0d1117;
  color: #c9d1d9;
}
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
nav { margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #30363d; }
nav a { margin-right: 1rem; padding: 0.35rem 0.6rem; border-radius: 0.35rem; }
nav a.active { background: #21262d; color: #f0f6fc; }
h1, h2, h3 { color: #f0f6fc; }
button, input[type="search"] {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 0.35rem;
  color: #c9d1d9;
  padding: 0.4rem 0.7rem;
  font: inherit;
}
button { cursor: pointer; }
button:hover { background: #30363d; }
input[type="search"] { width: 100%; max-width: 400px; margin-bottom: 0.75rem; }
table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; }
th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #30363d; }
th { color: #f0f6fc; }
tr:hover td { background: #161b22; }
.flash { padding: 0.75rem; border-radius: 0.35rem; margin: 0.75rem 0; }
.flash.ok { background: #238636; color: #fff; }
.flash.error { background: #da3633; color: #fff; }
.job { background: #161b22; border: 1px solid #30363d; border-radius: 0.35rem; padding: 0.75rem; margin: 0.75rem 0; }
.job.running { border-left: 4px solid #58a6ff; }
.job.done { border-left: 4px solid #238636; }
.job.failed { border-left: 4px solid #da3633; }
.job pre {
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 0.35rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  max-height: 300px;
  overflow: auto;
  padding: 0.75rem;
  white-space: pre-wrap;
  word-break: break-word;
}
.actions button { margin-right: 0.5rem; margin-bottom: 0.5rem; }
.config-form {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 0.5rem 0.75rem;
  align-items: center;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 0.35rem;
  padding: 0.75rem;
  margin: 0.75rem 0;
  max-width: 500px;
}
.config-form label { color: #8b949e; }
.config-form input, .config-form select {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 0.35rem;
  color: #c9d1d9;
  padding: 0.35rem 0.5rem;
  font: inherit;
  width: 100%;
  box-sizing: border-box;
}
.config-form .services { display: flex; gap: 1rem; }
.config-form button { grid-column: 1 / -1; justify-self: start; }
footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #30363d; color: #8b949e; font-size: 0.875rem; }
</style>
</head><body>
<nav><a href="/shows" {{if eq .Active "shows"}}class="active"{{end}}>Shows</a>
     <a href="/movies" {{if eq .Active "movies"}}class="active"{{end}}>Movies</a>
     <a href="/jobs" {{if eq .Active "jobs"}}class="active"{{end}}>Jobs</a>
     <a href="/config" {{if eq .Active "config"}}class="active"{{end}}>Config</a></nav>
<div id="flash"></div>
<div id="job">{{if .RunningJob}}{{template "job" .RunningJob}}{{end}}</div>
<main>{{template "content" .}}</main>
<footer>couchness {{.Version}}</footer>
</body></html>{{end}}
